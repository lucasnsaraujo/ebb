name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests only read the code; a pull request's run gets no write access and no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # The app really runs here, so only on a disposable runner session: it puts an item in the menu bar.
  budget:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release
        run: swift build -c release
      - name: Check the lightweight budget
        run: scripts/check-budget.sh "$(swift build -c release --show-bin-path)/Ebb"
      - name: Check ebb --uninstall-data
        if: ${{ !cancelled() }}
        run: scripts/check-uninstall.sh "$(swift build -c release --show-bin-path)/EbbCLI"
